name: SongNhat AI-02 CI & Gate G1 Controls

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  verify-pipeline-and-controls:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run full pytest suite (Sprint 1-3 & 40 Control Fixtures)
        run: |
          python -m pytest -v --junitxml=artifacts/gate_g1/junit_cf40.xml

      - name: Run 40 Control Fixtures JSON report generator (PLPT-48)
        run: |
          python scripts/run_control_fixtures.py

      - name: Run US-03 data audit
        run: |
          python scripts/us_03_check.py

      - name: Upload Gate G1 verification artifacts (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-g1-verification-reports
          path: |
            artifacts/gate_g1/control_fixtures_report.json
            artifacts/gate_g1/junit_cf40.xml
            artifacts/gate_g1/gate_g1_benchmark_report.json
          if-no-files-found: warn
