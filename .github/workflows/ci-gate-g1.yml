name: SongNhat AI-02 CI & Gate G1 Controls

on:
  push:
    branches: [main, dev, "feat/**", "member/**"]
  pull_request:
    branches: [main, dev]

jobs:
  verify-pipeline-and-controls:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute 40 Control Fixtures Suite (Gate G1)
        run: |
          python -m pytest tests/control_fixtures/test_gate_g1_controls.py -v --junitxml=artifacts/gate_g1/junit_cf40.xml

      - name: Run full pytest suite (Sprint 1-3)
        run: |
          python -m pytest -v

      - name: Run 40 Control Fixtures JSON report generator (PLPT-48)
        run: |
          python scripts/run_control_fixtures.py

      - name: Validate Zero-Failure Gate Threshold (100% Passed)
        run: |
          python -c "
          import json
          with open('artifacts/gate_g1/control_fixtures_report.json', encoding='utf-8') as f:
              rep = json.load(f)
          print('=' * 60)
          print(f\"Suite: {rep['suite_name']}\")
          print(f\"Pass Rate: {rep['pass_rate_pct']}%\")
          print(f\"Passed: {rep['passed_count']} / {rep['total_fixtures']}\")
          print(f\"Status: {rep['gate_g1_controls_status']}\")
          print('=' * 60)
          assert rep['gate_g1_controls_status'] == 'PASSED', 'Gate G1 status must be PASSED'
          assert rep['passed_count'] == 40, f'Expected 40 passed, got {rep[\"passed_count\"]}'
          assert rep['failed_count'] == 0, f'Expected 0 failed, got {rep[\"failed_count\"]}'
          "

      - name: Run US-03 data audit
        run: |
          python scripts/us_03_check.py

      - name: Upload Gate G1 verification artifacts (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-g1-verification-reports
          path: |
            artifacts/gate_g1/control_fixtures_report.json
            artifacts/gate_g1/junit_cf40.xml
            artifacts/gate_g1/gate_g1_benchmark_report.json
          if-no-files-found: warn
