name: Gate G1 - 40 Control Fixtures Verification CI

on:
  push:
    branches: [ dev, main, "feat/**", "member/**" ]
  pull_request:
    branches: [ dev, main ]

jobs:
  gate-g1-40-control-fixtures:
    name: Execute 40 Deterministic Control Fixtures (Gate G1)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute 40 Control Fixtures Suite
        run: |
          python -m pytest tests/control_fixtures/test_gate_g1_controls.py -v --junitxml=artifacts/gate_g1/junit_cf40.xml

      - name: Validate Zero-Failure Gate Threshold (100% Passed)
        run: |
          python -c "
          import json
          with open('artifacts/gate_g1/control_fixtures_report.json', encoding='utf-8') as f:
              rep = json.load(f)
          print('=' * 60)
          print(f\"Suite: {rep['suite_name']}\")
          print(f\"Pass Rate: {rep['pass_rate_pct']}%\")
          print(f\"Passed: {rep['passed_count']} / {rep['total_fixtures']}\")
          print(f\"Status: {rep['gate_g1_controls_status']}\")
          print('=' * 60)
          assert rep['gate_g1_controls_status'] == 'PASSED', 'Gate G1 status must be PASSED'
          assert rep['passed_count'] == 40, f'Expected 40 passed, got {rep[\"passed_count\"]}'
          assert rep['failed_count'] == 0, f'Expected 0 failed, got {rep[\"failed_count\"]}'
          "

      - name: Upload Gate G1 Audit Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-g1-control-fixtures-artifacts
          path: artifacts/gate_g1/
          retention-days: 30
